<!-- app/admin/templates/session_edit.html -->

{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">Редактирование сессии</h1>
        <p class="page-description" id="event-date-hint">
            Обновите данные сессии.
        </p>
    </div>

    <div class="btn-row">
        <a href="/admin/events/{{ event_id }}" class="btn btn-ghost">
            Назад к мероприятию
        </a>
    </div>

</div>

<!-- ===================== SESSION FORM ===================== -->

<section class="card form-card">
    <div class="card-header">
        <div>
            <h2 class="card-title">Данные сессии</h2>
            <p class="card-subtitle">
                Дата и время сессии должны находиться в пределах дат мероприятия.
            </p>
        </div>
    </div>

    <div class="card-body">
        <div id="speaker-success" class="success-alert" style="display:none;"></div>
        <div id="speaker-error" class="error-alert" style="display:none;"></div>
        <form id="session-form" class="admin-form">
            <div class="form-grid">

                <div class="form-field form-field-wide">
                    <label for="session-title">Название сессии</label>
                    <input type="text" id="session-title" required>
                </div>

                <div class="form-field form-field-wide">
                    <label for="session-description">Описание</label>
                    <textarea id="session-description" rows="5"></textarea>
                </div>

                <div class="form-field">
                    <label for="session-start">Начало</label>
                    <input type="datetime-local" id="session-start" required>
                </div>

                <div class="form-field">
                    <label for="session-end">Окончание</label>
                    <input type="datetime-local" id="session-end" required>
                </div>

                <div class="form-field form-field-wide">
                    <label for="session-location">Место</label>
                    <input type="text" id="session-location">
                </div>

            </div>

            <p id="error" class="error-alert" style="display:none;"></p>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    Сохранить
                </button>

                <button type="button" class="btn btn-ghost" onclick="goBack()">
                    Отмена
                </button>
            </div>
        </form>
    </div>

</section>

<!-- ===================== SPEAKERS ===================== -->

<section class="card form-card">
    <div class="card-header">
        <div>
            <h2 class="card-title">Спикеры</h2>
            <p class="card-subtitle">Управление спикерами сессии</p>
        </div>
    </div>

    <div class="card-body">

        <button type="button" class="btn btn-secondary" onclick="toggleSpeakerForm()">
            + Добавить спикера
        </button>
        <div id="speaker-list">
            <div class="loading-state">Загрузка...</div>
        </div>

        <hr style="margin:24px 0;">

        <div id="speaker-form-wrapper" style="display:none; margin-top:16px;">
            <form id="speaker-form" class="admin-form">

                <div class="form-grid">

                    <div class="form-field">
                        <label>Фамилия</label>
                        <input id="speaker-last-name" required>
                    </div>

                    <div class="form-field">
                        <label>Имя</label>
                        <input id="speaker-first-name" required>
                    </div>

                    <div class="form-field">
                        <label>Отчество</label>
                        <input id="speaker-second-name">
                    </div>

                    <div class="form-field form-field-wide">
                        <label>Email</label>
                        <input id="speaker-email" type="email" required>
                    </div>

                    <div class="form-field form-field-wide">
                        <label>Телефон</label>
                        <input id="speaker-phone">
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="speaker-submit-btn">
                        Добавить спикера
                    </button>
                </div>

            </form>
        </div>
    </div>

</section>

<script>
    const eventId = "{{ event_id }}";
    const sessionId = "{{ session_id }}";

    let eventStartDate = null;
    let eventEndDate = null;

    function getCookie(name) {
        const v = `; ${document.cookie}`;
        const p = v.split(`; ${name}=`);
        return p.length === 2 ? p.pop().split(";")[0] : null;
    }

    function escapeHtml(value) {
        if (value === null || value === undefined) return "";

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function showError(msg){
        const el=document.getElementById("error");
        el.innerText=msg; el.style.display="block";
    }

    function toggleSpeakerForm() {
        const el = document.getElementById("speaker-form-wrapper");

        if (!el) return;

        el.style.display = el.style.display === "none" ? "block" : "none";
    }

    function hideError(){
        const el=document.getElementById("error");
        el.innerText=""; el.style.display="none";
    }

    function setLoading(is){
        const b=document.getElementById("submit-btn");
        b.disabled=is;
        b.innerText=is?"Сохранение...":"Сохранить";
    }

    function showSpeakerError(msg){
        const el=document.getElementById("speaker-error");
        el.innerText=msg; el.style.display="block";
    }

    function hideSpeakerError(){
        const el=document.getElementById("speaker-error");
        el.innerText=""; el.style.display="none";
    }

    function showSpeakerSuccess(msg){
        const el=document.getElementById("speaker-success");
        el.innerText=msg; el.style.display="block";
    }

    async function loadSession() {
        const token = getCookie("access_token");

        const res = await fetch(`/api/v1/sessions/${sessionId}`, {
            headers: {
                Authorization: "Bearer " + token
            }
        });

        if (!res.ok) {
            alert("Ошибка загрузки сессии");
            return;
        }

        const session = await res.json();

        document.getElementById("session-title").value =
            session.title || "";

        document.getElementById("session-description").value =
            session.description || "";

        document.getElementById("session-location").value =
            session.location || "";

        if (session.start_date) {
            document.getElementById("session-start").value =
                session.start_date.slice(0, 16);
        }

        if (session.end_date) {
            document.getElementById("session-end").value =
                session.end_date.slice(0, 16);
        }
    }

    async function loadSpeakers(){
        const token=getCookie("access_token");
        const el=document.getElementById("speaker-list");

        el.innerHTML="Загрузка...";

        const res=await fetch(`/api/v1/sessions/${sessionId}/speakers`,{
            headers:{Authorization:"Bearer "+token}
        });

        if(!res.ok){
            el.innerHTML="Ошибка загрузки";
            return;
        }

        const data=await res.json();

        if(!data.items.length){
            el.innerHTML="<div>Спикеры не назначены</div>";
            return;
        }

        el.innerHTML="";

        data.items.forEach(s => {
            const d = document.createElement("div");
            d.className = "table-row speaker-row";

            d.innerHTML = `
                <div class="speaker-main">
                    <div class="speaker-name">
                        ${escapeHtml(s.last_name || "")} ${escapeHtml(s.first_name || "")}
                    </div>

                    <div class="speaker-meta">
                        ${escapeHtml(s.email || "")}
                        ${s.phone ? " · " + escapeHtml(s.phone) : ""}
                    </div>
                </div>

                <div class="speaker-actions actions-cell">
                    <button class="btn btn-ghost btn-sm" onclick="removeSpeaker('${s.id}')">
                        Удалить
                    </button>
                </div>
            `;

            el.appendChild(d);
        });
    }

    async function removeSpeaker(id){
        const token=getCookie("access_token");

        await fetch(`/api/v1/sessions/${sessionId}/speakers/${id}`,{
            method:"DELETE",
            headers:{Authorization:"Bearer "+token}
        });

        loadSpeakers();
    }


    // SESSION SAVE

    document.getElementById("session-form").addEventListener("submit",async(e)=>{
        e.preventDefault(); hideError(); setLoading(true);

        const token=getCookie("access_token");

        const payload={
            title:document.getElementById("session-title").value,
            description:document.getElementById("session-description").value,
            start_date:new Date(document.getElementById("session-start").value).toISOString(),
            end_date:new Date(document.getElementById("session-end").value).toISOString(),
            location:document.getElementById("session-location").value
        };

        const res=await fetch(`/api/v1/sessions/${sessionId}`,{
            method:"PUT",
            headers:{
                Authorization:"Bearer "+token,
                "Content-Type":"application/json"
            },
            body:JSON.stringify(payload)
        });

        if(!res.ok){
            const d=await res.json().catch(()=>({}));
            showError(d.detail||"Ошибка");
            setLoading(false);
            return;
        }

        window.location.href=`/admin/events/${eventId}`;
    });


    // SPEAKER FORM

    document.getElementById("speaker-form").addEventListener("submit",async(e)=>{
        e.preventDefault();

        hideSpeakerError();

        const token=getCookie("access_token");

        const payload={
            first_name:document.getElementById("speaker-first-name").value.trim(),
            second_name:document.getElementById("speaker-second-name").value.trim(),
            last_name:document.getElementById("speaker-last-name").value.trim(),
            email:document.getElementById("speaker-email").value.trim(),
            phone:document.getElementById("speaker-phone").value.trim()
        };

        const res=await fetch(`/api/v1/sessions/${sessionId}/speakers`,{
            method:"POST",
            headers:{
                Authorization:"Bearer "+token,
                "Content-Type":"application/json"
            },
            body:JSON.stringify(payload)
        });

        const data=await res.json();

        if(!res.ok){
            showSpeakerError(data.detail||"Ошибка");
            return;
        }

        showSpeakerSuccess("Спикер добавлен");
        e.target.reset();
        loadSpeakers();
    });


    function goBack(){
        window.location.href=`/admin/events/${eventId}`;
    }


    document.addEventListener("DOMContentLoaded",()=>{
        loadSession();
        loadSpeakers();
    });

</script>

{% endblock %}
