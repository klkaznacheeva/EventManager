<!-- app/admin/templates/register.html -->
{% extends "base.html" %}

{% block content %}

<div class="auth-page">
    <section class="card auth-card">
        <div class="auth-card-header">
            <div class="auth-icon">EM</div>
            <h1 class="auth-title">Регистрация</h1>
            <p class="auth-description">
                Создайте аккаунт для работы с сервисом мероприятий.
            </p>
        </div>

        <form id="register-form" class="admin-form">
            <div class="form-grid">
                <div class="form-field">
                    <label for="first_name">Имя</label>
                    <input type="text" id="first_name" placeholder="Введите имя" required>
                </div>

                <div class="form-field">
                    <label for="last_name">Фамилия</label>
                    <input type="text" id="last_name" placeholder="Введите фамилию">
                </div>

                <div class="form-field">
                    <label for="second_name">Отчество</label>
                    <input type="text" id="second_name" placeholder="Введите отчество">
                </div>

                <div class="form-field">
                    <label for="birth_date">Дата рождения</label>
                    <input type="date" id="birth_date">
                </div>

                <div class="form-field form-field-wide">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@mail.ru" required>
                </div>

                <div class="form-field form-field-wide">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Введите пароль" required>
                </div>

                <div class="form-field form-field-wide">
                    <label for="phone">Телефон</label>
                    <input type="text" id="phone" placeholder="+7 999 999-99-99">
                </div>
            </div>

            <p id="error" class="error-alert" style="display:none;"></p>

            <div class="form-actions auth-actions">
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    Зарегистрироваться
                </button>
            </div>
        </form>

        <div class="auth-footer">
            Уже есть аккаунт?
            {% set next_param = request.query_params.get('next', '') %}
            <a href="/admin/login{{ '?next=' + next_param if next_param else '' }}">Войти</a>
        </div>
    </section>
</div>

<script>
    function getNextUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        let next = urlParams.get('next');
        if (!next) return null;
        // Если абсолютный URL – оставляем как есть
        if (next.startsWith('http://') || next.startsWith('https://')) {
            return next;
        }
        // Иначе делаем относительный путь с ведущим слешем
        if (!next.startsWith('/')) {
            next = '/' + next;
        }
        return next;
    }

    function showError(message) {
        const error = document.getElementById("error");
        error.innerText = message;
        error.style.display = "block";
    }

    function hideError() {
        const error = document.getElementById("error");
        error.innerText = "";
        error.style.display = "none";
    }

    function setSubmitLoading(isLoading) {
        const submitBtn = document.getElementById("submit-btn");
        submitBtn.disabled = isLoading;
        submitBtn.innerText = isLoading ? "Регистрация..." : "Зарегистрироваться";
    }

    document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const payload = {
            first_name: document.getElementById("first_name").value.trim(),
            second_name: document.getElementById("second_name").value.trim(),
            last_name: document.getElementById("last_name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            phone: document.getElementById("phone").value.trim(),
            birth_date: document.getElementById("birth_date").value || null
        };

        setSubmitLoading(true);

        try {
            const res = await fetch("/api/v1/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                let message = "Ошибка регистрации";
                try {
                    const data = await res.json();
                    message = data.detail || message;
                } catch (err) {
                    console.error(err);
                }
                showError(message);
                return;
            }

            const data = await res.json();

            document.cookie = `access_token=${data.access_token}; path=/`;

            const nextUrl = getNextUrl();
            if (nextUrl) {
                window.location.href = nextUrl;
            } else {
                window.location.href = "/admin/dashboard";
            }

        } catch (err) {
            console.error(err);
            showError("Ошибка соединения с сервером");
        } finally {
            setSubmitLoading(false);
        }
    });
</script>

{% endblock %}
