{% extends "base.html" %}

{% block content %}
<h2>Панель мероприятий</h2>
<p>Привет, {{ user_name }}</p>

<button onclick="goToProfile()">Профиль</button>

<button id="create-event-btn" onclick="goToCreateEvent()">Создать мероприятие</button>

<table border="1" cellpadding="5" cellspacing="0" id="events-table">
    <thead>
    <tr>
        <th>Название</th>
        <th>Описание</th>
        <th>Дата начала</th>
        <th>Дата окончания</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    function getUserMode(profile) {
        if (profile.is_system) return null;
        return localStorage.getItem("user_mode") || "organizer";
    }

    async function loadProfile() {
        const token = getCookie("access_token");

        const res = await fetch("/api/v1/users/profile", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (!res.ok) return null;

        return await res.json();
    }

    async function loadEvents() {
        const token = getCookie("access_token");
        if (!token) return;

        const profile = await loadProfile();
        if (!profile) return;

        const isAdmin = profile.is_system;
        const userMode = getUserMode(profile);

        setupUI(profile, userMode);

        const res = await fetch("/api/v1/events?page=1&limit=100", {
            headers: {
                "Authorization": "Bearer " + token,
                ...(userMode && {"X-User-Mode": userMode})
            }
        });

        if (!res.ok) {
            alert("Ошибка получения мероприятий");
            return;
        }

        const data = await res.json();

        const tbody = document.querySelector("#events-table tbody");
        tbody.innerHTML = "";

        data.items.forEach(event => {
            const tr = document.createElement("tr");

            let actionsHtml = `
            <button onclick="goToEvent('${event.id}')">Детали</button>
        `;

            // 👑 ADMIN
            if (isAdmin) {
                actionsHtml += `
                <button onclick="approveEvent('${event.id}')">Проверено</button>
                <button onclick="rejectEvent('${event.id}')">На доработку</button>
            `;
            }

            // 👨‍💼 ORGANIZER
            else if (userMode === "organizer") {
                actionsHtml += `
                <button onclick="editEvent('${event.id}')">Редактировать</button>
                <button onclick="deleteEvent('${event.id}')">Удалить</button>
            `;
            }

            // 👤 PARTICIPANT
            else if (userMode === "participant") {
                actionsHtml += `
                <button onclick="joinEvent('${event.id}')">Записаться</button>
            `;
            }

            tr.innerHTML = `
            <td>${event.title}</td>
            <td>${event.description || ''}</td>
            <td>${new Date(event.start_date).toLocaleString()}</td>
            <td>${new Date(event.end_date).toLocaleString()}</td>
            <td>${event.status_label}</td>
            <td>${actionsHtml}</td>
        `;

            tbody.appendChild(tr);
        });
    }

    // 🔥 управление UI
    function setupUI(profile, mode) {
        const createBtn = document.getElementById("create-event-btn");
        const switchBtn = document.getElementById("switch-mode-btn");

        // 👑 ADMIN
        if (profile.is_system) {
            if (createBtn) createBtn.style.display = "none";
            if (switchBtn) switchBtn.style.display = "none";
            return;
        }

        // 👤 PARTICIPANT
        if (mode === "participant") {
            if (createBtn) createBtn.style.display = "none";
        }

        // 👨‍💼 ORGANIZER
        if (mode === "organizer") {
            if (createBtn) createBtn.style.display = "inline-block";
        }
    }

    // --- actions ---
    function goToEvent(id) {
        window.location.href = `/admin/events/${id}`;
    }

    function goToCreateEvent() {
        window.location.href = "/admin/events/create";
    }

    function goToProfile() {
        window.location.href = "/admin/profile";
    }

    function switchMode() {
        window.location.href = "/admin/mode-select";
    }

    function editEvent(eventId) {
        window.location.href = `/admin/events/${eventId}/edit`;
    }

    // --- функция удаления ---
    async function deleteEvent(eventId) {
        if (!confirm("Вы уверены, что хотите удалить мероприятие?")) return;
        const token = getCookie("access_token");

        const res = await fetch(`/api/v1/events/${eventId}`, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        });

        if (!res.ok) {
            alert("Ошибка при удалении");
            return;
        }

        alert("Мероприятие удалено");
        loadEvents(); // обновляем таблицу
    }

    async function approveEvent(eventId) {
        const token = getCookie("access_token");

        const res = await fetch(`/api/v1/events/${eventId}/reviewed`, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (!res.ok) {
            alert("Ошибка при подтверждении");
            return;
        }

        alert("Мероприятие проверено");
        loadEvents();
    }

    async function rejectEvent(eventId) {
        const reason = prompt("Укажите причину доработки:");

        if (!reason) {
            alert("Причина обязательна");
            return;
        }

        const token = getCookie("access_token");

        const res = await fetch(`/api/v1/events/${eventId}/needs-edit`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({
                reason: reason
            })
        });

        if (!res.ok) {
            alert("Ошибка при отправке на доработку");
            return;
        }

        alert("Отправлено на доработку");
        loadEvents(); // 🔥 обновляем список
    }

    async function joinEvent(eventId) {
        const token = getCookie("access_token");

        const res = await fetch(`/api/v1/events/${eventId}/join`, {
            method: "POST",
            headers: {"Authorization": "Bearer " + token}
        });
        if(!res.ok){
            const data = await res.json();
            return alert(data.detail || "Ошибка при записи");
        }
        alert("Вы успешно записались на мероприятие");
        // Обновим счетчик участников
        loadEvent(eventId);
    }

    async function logout() {
        await fetch("/api/v1/auth/logout", {method: "POST"});
        localStorage.removeItem("user_mode");
        window.location.href = "/admin/login";
    }

    document.addEventListener("DOMContentLoaded", loadEvents);
</script>

{% endblock %}
