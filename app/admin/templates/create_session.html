<!-- app/admin/templates/create_session.html -->
{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">Создание сессии</h1>
        <p class="page-description" id="event-date-hint">
            Добавьте сессию в программу мероприятия.
        </p>
    </div>

    <div class="btn-row">
        <a href="/admin/events/{{ event_id }}" class="btn btn-ghost">
            Назад к мероприятию
        </a>
    </div>
</div>

<section class="card form-card">
    <div class="card-header">
        <div>
            <h2 class="card-title">Основная информация</h2>
            <p class="card-subtitle">
                Дата и время сессии должны находиться в пределах дат самого мероприятия.
            </p>
        </div>
    </div>

    <div class="card-body">
        <form id="create-session-form" class="admin-form">
            <div class="form-grid">
                <div class="form-field form-field-wide">
                    <label for="title">Название сессии</label>
                    <input type="text" id="title" placeholder="Например: Открывающая лекция" required>
                </div>

                <div class="form-field form-field-wide">
                    <label for="description">Описание</label>
                    <textarea id="description" rows="5" placeholder="Кратко опишите содержание сессии"></textarea>
                </div>

                <div class="form-field">
                    <label for="start_date">Дата и время начала</label>
                    <input type="datetime-local" id="start_date" required>
                </div>

                <div class="form-field">
                    <label for="end_date">Дата и время окончания</label>
                    <input type="datetime-local" id="end_date" required>
                </div>

                <div class="form-field">
                    <label for="location">Локация</label>
                    <input type="text" id="location" placeholder="Например: Зал 1">
                </div>

                <div class="form-field">
                    <label for="type">Тип сессии</label>
                    <input type="text" id="type" placeholder="Например: Лекция, мастер-класс, доклад">
                </div>

                <div class="form-field">
                    <label for="age_limit">Возрастное ограничение</label>
                    <input type="number" id="age_limit" placeholder="Например: 18" min="0">
                </div>

                <div class="form-field">
                    <label for="status">Статус</label>
                    <select id="status" required>
                        <option value="">Загрузка статусов...</option>
                    </select>
                </div>
            </div>

            <p id="error" class="error-alert" style="display:none;"></p>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    Создать сессию
                </button>

                <a href="/admin/events/{{ event_id }}" class="btn btn-ghost">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</section>

<script>
    const eventId = "{{ event_id }}";

    let eventStartDate = null;
    let eventEndDate = null;

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
    }

    function showError(message) {
        const error = document.getElementById("error");
        error.innerText = message;
        error.style.display = "block";
    }

    function hideError() {
        const error = document.getElementById("error");
        error.innerText = "";
        error.style.display = "none";
    }

    function setSubmitLoading(isLoading) {
        const submitBtn = document.getElementById("submit-btn");

        submitBtn.disabled = isLoading;
        submitBtn.innerText = isLoading ? "Создание..." : "Создать сессию";
    }

    function toDateTimeLocal(value) {
        if (!value) return "";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "";
        }

        return date.toISOString().slice(0, 16);
    }

    function formatDateTime(value) {
        if (!value) return "не указано";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "не указано";
        }

        return date.toLocaleString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    async function loadEventBounds() {
        const token = getCookie("access_token");

        if (!token) {
            showError("Пользователь не авторизован");
            return;
        }

        try {
            const res = await fetch(`/api/v1/events/${eventId}`, {
                headers: {
                    "Authorization": "Bearer " + token,
                    "X-User-Mode": localStorage.getItem("user_mode") || "organizer"
                }
            });

            if (!res.ok) {
                showError("Ошибка загрузки мероприятия");
                return;
            }

            const event = await res.json();

            eventStartDate = new Date(event.start_date);
            eventEndDate = new Date(event.end_date);

            const minValue = toDateTimeLocal(event.start_date);
            const maxValue = toDateTimeLocal(event.end_date);

            document.getElementById("start_date").min = minValue;
            document.getElementById("start_date").max = maxValue;
            document.getElementById("end_date").min = minValue;
            document.getElementById("end_date").max = maxValue;

            document.getElementById("event-date-hint").innerText =
                `Сессия должна проходить в период мероприятия: ${formatDateTime(event.start_date)} — ${formatDateTime(event.end_date)}.`;

        } catch (err) {
            console.error(err);
            showError("Ошибка соединения с сервером");
        }
    }

    async function loadStatuses() {
        const select = document.getElementById("status");

        try {
            const res = await fetch("/api/v1/enums/session-statuses");

            if (!res.ok) {
                select.innerHTML = `<option value="">Ошибка загрузки статусов</option>`;
                return;
            }

            const data = await res.json();

            select.innerHTML = `<option value="">Выберите статус</option>`;

            data.items.forEach(item => {
                const option = document.createElement("option");
                option.value = item.value;
                option.textContent = item.label;
                select.appendChild(option);
            });

        } catch (err) {
            console.error("Ошибка загрузки статусов:", err);
            select.innerHTML = `<option value="">Ошибка загрузки статусов</option>`;
        }
    }

    function validateSessionDates(startDate, endDate) {
        if (!eventStartDate || !eventEndDate) {
            return "Не удалось определить границы мероприятия";
        }

        if (endDate <= startDate) {
            return "Дата окончания сессии должна быть позже даты начала";
        }

        if (startDate < eventStartDate) {
            return "Дата начала сессии не может быть раньше даты начала мероприятия";
        }

        if (endDate > eventEndDate) {
            return "Дата окончания сессии не может быть позже даты окончания мероприятия";
        }

        return null;
    }

    async function createSession(e) {
        e.preventDefault();
        hideError();

        const token = getCookie("access_token");

        if (!token) {
            showError("Пользователь не авторизован");
            return;
        }

        const startDateValue = document.getElementById("start_date").value;
        const endDateValue = document.getElementById("end_date").value;

        const startDate = new Date(startDateValue);
        const endDate = new Date(endDateValue);

        const validationError = validateSessionDates(startDate, endDate);

        if (validationError) {
            showError(validationError);
            return;
        }

        const ageLimitValue = document.getElementById("age_limit").value;

        const payload = {
            event_id: eventId,
            title: document.getElementById("title").value.trim(),
            description: document.getElementById("description").value.trim(),
            start_date: startDate.toISOString(),
            end_date: endDate.toISOString(),
            location: document.getElementById("location").value.trim(),
            type: document.getElementById("type").value.trim(),
            age_limit: ageLimitValue ? parseInt(ageLimitValue) : null,
            status: document.getElementById("status").value
        };

        setSubmitLoading(true);

        try {
            const res = await fetch("/api/v1/sessions/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                let message = "Ошибка создания сессии";

                try {
                    const data = await res.json();
                    message = data.detail || message;
                } catch (err) {
                    console.error(err);
                }

                showError(message);
                return;
            }

            window.location.href = `/admin/events/${eventId}`;

        } catch (err) {
            console.error(err);
            showError("Ошибка соединения с сервером");
        } finally {
            setSubmitLoading(false);
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        loadEventBounds();
        loadStatuses();

        document
            .getElementById("create-session-form")
            .addEventListener("submit", createSession);
    });
</script>

{% endblock %}
