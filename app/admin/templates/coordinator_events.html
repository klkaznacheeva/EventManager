{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">Мои мероприятия</h1>
        <p class="page-description">
            Мероприятия, где вы координатор, и ваши задачи
        </p>
    </div>
</div>

<section class="card">
    <div class="card-body">

        <div id="events-list" class="sessions-list">
            <div class="loading-state">Загрузка...</div>
        </div>

    </div>
</section>

<script>

function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(";").shift();
    return null;
}

function escapeHtml(value) {
    if (!value) return "";
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDate(value) {
    if (!value) return "—";
    const d = new Date(value);
    return d.toLocaleString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

async function api(url, options = {}) {
    const token = getCookie("access_token");

    return fetch(url, {
        ...options,
        headers: {
            ...(options.headers || {}),
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        }
    });
}

/**
 * загрузка ВСЕГО одним батчем
 */
async function loadData() {

    const container = document.getElementById("events-list");

    container.innerHTML = `<div class="loading-state">Загрузка...</div>`;

    const [eventsRes, tasksRes] = await Promise.all([
        api(`/api/v1/events/coordinator/events`),
        api(`/api/v1/events/tasks/my`)
    ]);

    if (!eventsRes.ok) {
        container.innerHTML = `<div class="empty-state">Ошибка загрузки мероприятий</div>`;
        return;
    }

    const eventsData = await eventsRes.json();
    const tasksData = tasksRes.ok ? await tasksRes.json() : { items: [] };

    const events = eventsData.items || [];
    const tasks = tasksData.items || [];

    if (!events.length) {
        container.innerHTML = `<div class="empty-state">Нет мероприятий</div>`;
        return;
    }

    container.innerHTML = "";

    events.forEach(event => {

        const eventTasks = tasks.filter(t =>
            t.entity_type === "event" &&
            t.entity_id === event.id
        );

        const div = document.createElement("div");
        div.className = "session-card";

        div.innerHTML = `
            <div class="session-top">

                <div style="width:100%">

                    <div style="display:flex;justify-content:space-between;gap:20px">

                        <div>
                            <h3 class="session-title">${escapeHtml(event.title)}</h3>
                            <div class="session-description">
                                ${escapeHtml(event.description || "")}
                            </div>
                        </div>

                        <a class="btn btn-primary btn-sm"
                           href="/admin/events/${event.id}">
                            Мероприятие
                        </a>

                    </div>

                    <div style="margin-top:15px;font-size:13px;color:#666">
                        Задач: ${eventTasks.length}
                    </div>

                    <div id="tasks-${event.id}" style="margin-top:15px"></div>

                </div>

            </div>
        `;

        container.appendChild(div);

        renderTasks(event.id, eventTasks);
    });
}

function renderTasks(eventId, tasks) {

    const container = document.getElementById(`tasks-${eventId}`);

    if (!tasks.length) {
        container.innerHTML = `<div class="empty-state">Нет задач</div>`;
        return;
    }

    container.innerHTML = "";

    tasks.forEach(task => {

        const isDone = task.assignees?.[0]?.is_completed;

        const div = document.createElement("div");

        div.className = "session-card";
        div.style.marginTop = "10px";

        div.innerHTML = `
            <div style="display:flex;justify-content:space-between">

                <div style="flex:1">

                    <div style="font-weight:600">
                        ${escapeHtml(task.title)}
                    </div>

                    <div style="font-size:13px;color:#666;margin-top:5px">
                        ${escapeHtml(task.description || "")}
                    </div>

                    ${task.deadline ? `
                        <div style="font-size:12px;margin-top:5px;color:#999">
                            дедлайн: ${formatDate(task.deadline)}
                        </div>
                    ` : ""}

                </div>

                <div>

                    ${isDone
                        ? `<span class="status-badge status-reviewed">✓ выполнено</span>`
                        : `<button class="btn btn-success btn-sm"
                                   onclick="completeTask('${task.id}')">
                                выполнить
                           </button>`
                    }

                </div>

            </div>
        `;

        container.appendChild(div);
    });
}

async function completeTask(taskId) {

    const res = await api(`/api/v1/checklists/${taskId}/complete`, {
        method: "PATCH",
        body: JSON.stringify({ comment: "" })
    });

    if (!res.ok) {
        alert("Ошибка выполнения задачи");
        return;
    }

    // просто перезагружаем данные
    loadData();
}

document.addEventListener("DOMContentLoaded", loadData);

</script>

{% endblock %}
