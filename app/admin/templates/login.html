{% extends "base.html" %}

{% block content %}
<h2>Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<p id="error" style="color:red;"></p>
<p>
    Нет аккаунта? <a href="/admin/register">Зарегистрироваться</a>
</p>

<script>
    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const response = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        if (!response.ok) {
            document.getElementById("error").innerText = "Неверный логин или пароль";
            return;
        }

        const data = await response.json();

        // сохраняем токен
        document.cookie = `access_token=${data.access_token}; path=/`;

        const profileRes = await fetch("/api/v1/users/profile", {
            headers: {
                "Authorization": "Bearer " + data.access_token
            }
        });

        const profile = await profileRes.json();

        if (profile.is_system) {
            localStorage.removeItem("user_mode"); // на всякий случай
            window.location.href = "/admin/dashboard";
        } else {
            window.location.href = "/admin/mode-select";
        }
    }
</script>
{% endblock %}
