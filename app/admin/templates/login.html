<!-- app/admin/templates/login.html -->
{% extends "base.html" %}

{% block content %}

<div class="auth-page">
    <section class="card auth-card auth-card-small">

        <div class="auth-card-header">
            <div class="auth-icon">EM</div>
            <h1 class="auth-title">Вход</h1>
            <p class="auth-description">
                Войдите в аккаунт для управления мероприятиями и сессиями.
            </p>
        </div>

        <form id="login-form" class="admin-form">

            <div class="form-grid auth-form-grid">

                <div class="form-field form-field-wide">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="example@mail.ru" required>
                </div>

                <div class="form-field form-field-wide">
                    <label for="password">Пароль</label>
                    <input id="password" type="password" placeholder="Введите пароль" required>
                </div>

            </div>

            <p id="error" class="error-alert" style="display:none;"></p>

            <div class="form-actions auth-actions">
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    Войти
                </button>
            </div>

        </form>

        <div class="auth-footer">
            Нет аккаунта?
            <a href="/admin/register">Зарегистрироваться</a>
        </div>

    </section>
</div>

<script>
    function showError(message) {
        const error = document.getElementById("error");
        error.innerText = message;
        error.style.display = "block";
    }

    function hideError() {
        const error = document.getElementById("error");
        error.innerText = "";
        error.style.display = "none";
    }

    function setSubmitLoading(isLoading) {
        const btn = document.getElementById("submit-btn");
        btn.disabled = isLoading;
        btn.innerText = isLoading ? "Вход..." : "Войти";
    }

    async function login() {
        hideError();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showError("Введите email и пароль");
            return;
        }

        setSubmitLoading(true);

        try {
            const response = await fetch("/api/v1/auth/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ email, password })
            });

            if (!response.ok) {
                showError("Неверный логин или пароль");
                return;
            }

            const data = await response.json();

            document.cookie = `access_token=${data.access_token}; path=/; SameSite=Lax`;

            if (data.user_roles) {
                localStorage.setItem("user_roles", JSON.stringify(data.user_roles));
            }

            const profileRes = await fetch("/api/v1/users/profile", {
                headers: {
                    "Authorization": "Bearer " + data.access_token
                }
            });

            if (!profileRes.ok) {
                showError("Не удалось загрузить профиль пользователя");
                return;
            }

            const profile = await profileRes.json();

            // =========================
            // SYSTEM ADMIN
            // =========================
            if (profile.is_system) {
                localStorage.removeItem("user_mode");
                window.location.href = "/admin/dashboard";
                return;
            }

            // =========================
            // SPEAKER AUTO MODE
            // =========================
            const roles = data.user_roles || [];

            const isSpeaker = roles.includes("speaker");

            if (isSpeaker && roles.length === 1) {
                // человек ТОЛЬКО спикер → не спрашиваем режим
                localStorage.setItem("user_mode", "speaker");
                window.location.href = "/admin/dashboard";
                return;
            }

            if (isSpeaker && roles.includes("user")) {
                // смешанный пользователь → тоже можно авто speaker
                localStorage.setItem("user_mode", "speaker");
                window.location.href = "/admin/dashboard";
                return;
            }

            // =========================
            // DEFAULT FLOW
            // =========================
            window.location.href = "/admin/mode-select";

        } catch (err) {
            console.error(err);
            showError("Ошибка соединения с сервером");
        } finally {
            setSubmitLoading(false);
        }
    }

    document.getElementById("login-form")
        .addEventListener("submit", e => {
            e.preventDefault();
            login();
        });
</script>
{% endblock %}
